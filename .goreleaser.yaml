# Release builds for the native CLI. Pushing a v* tag runs this through
# .github/workflows/release.yml; `goreleaser release --snapshot --clean`
# builds everything locally without publishing.
version: 2

project_name: string

builds:
  - main: ./cmd/string
    binary: string
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  # Version-free names let install.sh fetch releases/latest/download/<name>.
  - name_template: "string_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  github:
    owner: usestring
    name: cli

nfpms:
  - package_name: string
    homepage: https://usestring.ai
    description: Search the web, fetch pages as Markdown and map sites from the terminal
    maintainer: String <support@usestring.ai>
    vendor: String
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin

dockers_v2:
  - images: [ghcr.io/usestring/cli]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/usestring/cli
      org.opencontainers.image.description: String Web Access CLI
      org.opencontainers.image.licenses: MIT

# The cask lives in this repository's Casks directory, so the repository is
# its own Homebrew tap. Each release opens a pull request that updates it.
homebrew_casks:
  - name: string
    binaries: [string]
    homepage: https://usestring.ai
    description: Search the web, fetch pages as Markdown and map sites from the terminal
    license: MIT
    directory: Casks
    repository:
      owner: usestring
      name: cli
      branch: "homebrew-{{ .Version }}"
      token: "{{ .Env.GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: usestring
          name: cli
          branch: main
    hooks:
      post:
        # The binary is not notarized, so clear the quarantine flag macOS
        # puts on downloads; otherwise Gatekeeper refuses to run it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/string"]
          end
